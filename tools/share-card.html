<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <title>Share card</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    /* Link preview image (1200 x 630). Same photo and tint as the home page hero.
       Everything sits in the middle so square thumbnails (WhatsApp, some
       messengers) still show the logo, name, address and hours. */
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ink-deep); color: var(--white); }
    .og { position: relative; isolation: isolate; width: 1200px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .og-bg { position: absolute; inset: 0; z-index: -2; background: url("../assets/img/photos/wash-66-building-quispamsis.webp") 50% 40% / cover no-repeat; opacity: .6; }
    .og-tint {
      position: absolute; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse 62% 78% at 50% 50%, color-mix(in srgb, var(--ink-deep) 70%, transparent) 0%, transparent 100%),
        linear-gradient(180deg, color-mix(in srgb, var(--ink) 50%, transparent) 0%, color-mix(in srgb, var(--ink) 82%, transparent) 100%);
    }
    .og-logo { width: 104px; height: auto; margin-bottom: 18px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }
    .og h1 { margin: 0; font-size: 104px; font-weight: 900; line-height: .9; letter-spacing: -0.03em; text-transform: uppercase; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
    .og-sub { margin: 14px 0 0; font-size: 30px; font-weight: 700; color: var(--accent-on-dark); letter-spacing: .01em; }
    .og-facts { list-style: none; margin: 28px 0 0; padding: 24px 8px 0; display: grid; justify-items: center; gap: 14px; border-top: 2px solid rgba(255,255,255,.55); }
    .og-facts li { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
    .og-facts svg { width: 32px; height: 32px; flex: none; color: var(--accent-on-dark); }
  </style>
</head>
<body>
  <div class="og">
    <div class="og-bg"></div>
    <div class="og-tint"></div>
    <img class="og-logo" src="../assets/img/logo-badge.svg" alt="">
    <h1>Wash 66</h1>
    <p class="og-sub">Soft-touch express car wash</p>
    <ul class="og-facts">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        7 Pettingill Road, Quispamsis, NB
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Open every day, 8 am to 7 pm
      </li>
    </ul>
  </div>
</body>
</html>
